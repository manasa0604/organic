version: 0.2

env:
  variables:
    AWS_REGION: us-east-1
    AWS_ACCOUNT_ID: 044519418214
    REPOSITORY_NAME: organic
     REPOSITORY_URI: 044519418214.dkr.ecr.us-east-1.amazonaws.com/organic
phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - $(aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com)
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$REPOSITORY_NAME
      
  build:
    commands:
      - echo Building the Docker image...
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest

  post_build:
    commands:
       - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:latest
      - echo Creating imagedefinitions.json file...
      - printf '[{"name":"organic","imageUri":"%s"}]' $REPOSITORY_URI:latest > imagedefinitions.json

artifacts:
  files: '**/*'
